<!DOCTYPE html>
<html>
<head>
    <title>Smart Farming System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="mainApp">
    <div class="top-bar">
        <button onclick="uploadImage()">Upload Image</button>
        <button onclick="takePhoto()">Take Photo</button>
        <button onclick="analyze()">Analyse</button>
        <button class="clear" onclick="clearResults()">Clear Results</button>
        <button onclick="openDiagrams()">View Diagrams</button>
    </div>

    <div class="container">

        <div class="panel">
            <h3>Original Image</h3>
            <img id="preview" />
            <video id="camera" autoplay style="display:none;"></video>
            <button id="captureBtn" style="display:none;">Capture</button>
        </div>

        <div class="panel">
            <h3>Annotated Image</h3>
            <img id="output" />
        </div>

        <div class="panel results">
            <h3>Results</h3>
            <div id="results"></div>
        </div>

    </div>
</div>
<div id="diagrams" style="display:none;">

    <div class="top-bar">
        <button onclick="goBack()">Back to App</button>
    </div>

    <div class="diagram-section">
        <h2>System Diagrams</h2>

        <div class="diagram-grid">
            <img src="runs/detect/val/BoxF1_curve.png">
            <img src="runs/detect/val/BoxP_curve.png">
            <img src="runs/detect/val/BoxPR_curve.png">
            <img src="runs/detect/val/BoxR_curve.png">
            <img src="runs/detect/val/confusion_matrix.png">
            <img src="runs/detect/val/confusion_matrix_normalized.png">
        </div>
    </div>

</div>

<div class="chatbox">
    <h3>AI Assistant</h3>

    <div id="chatMessages" class="chat-messages"></div>

    <div class="chat-input">
        <button onclick="askAI()">Explain Result</button>
    </div>
</div>
<script src="/eel.js"></script>
<script src="script.js"></script>

</body>
</html>
